services:
  postgres:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tagmanager}
      POSTGRES_USER: ${POSTGRES_USER:-tagmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tagmanager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      args:
        MIRROR_PREFIX: docker.1ms.run/library/
    command: ["/app/api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tagmanager}:${POSTGRES_PASSWORD:-tagmanager}@postgres:5432/${POSTGRES_DB:-tagmanager}?sslmode=disable
      API_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        MIRROR_PREFIX: docker.1ms.run/library/
    command: ["/app/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tagmanager}:${POSTGRES_PASSWORD:-tagmanager}@postgres:5432/${POSTGRES_DB:-tagmanager}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        MIRROR_PREFIX: docker.1ms.run/library/
    ports:
      - "4173:80"
    depends_on:
      - api

volumes:
  postgres-data:
